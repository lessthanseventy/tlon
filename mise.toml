# mise.toml — the shared dev-loop API for ficciones.
#
# One vocabulary for the human and any agent: everything is driven through
# `mise run <task>` (`mise tasks` lists them), and the AGENTS.md files point here
# so there is no second source of truth for "how do I test / check / run this."
# mise owns the dev runtime; Nix owns packaging and the system.

[tools]
# The combined build (precompiled for this OTP) — pairing a bare "1.19" with a
# separate erlang picks an incompatible OTP and fails to boot.
# OTP 28: the aleph line needs it (ghostty_ex/libghostty-vt), and aleph boots
# funes, so the whole repo runs on one OTP. funes' green gate re-proves the bump.
erlang = "28"
elixir = "1.19.5-otp-28"
# manos' pi adapter is TypeScript; bun runs it natively (no build step) and is the test
# runner. mise owns the dev runtime, so the JS toolchain is pinned here too, not assumed.
bun = "1.3.14"

[tasks."funes:test"]
description = "funes: run the test suite (the TDD loop)"
dir = "modules/funes"
run = "mix test"

[tasks."funes:check"]
description = "funes: the precommit gate — format + warnings-as-errors + credo + tests"
dir = "modules/funes"
run = "mix precommit"

[tasks."funes:setup"]
description = "funes: fetch deps, create + migrate a repo-local scratch db"
dir = "modules/funes"
run = "mix deps.get && FUNES_DB=.dev/funes.db mix ecto.create --quiet && FUNES_DB=.dev/funes.db mix ecto.migrate"

[tasks."funes:doctor"]
description = "funes: the 2am report against the scratch db"
dir = "modules/funes"
run = "FUNES_DB=.dev/funes.db mix funes.doctor"

# Boot funes with its sovereign channel on (pi doc §2a), loopback-only, against the
# scratch db — so a hand-spawned pi pane has something to register with. In the iex it
# drops you into, `Funes.MCP.Spawn.env("title", "Agent")` prints the export FUNES_* block
# to paste into the pane. This is the human-as-arbiter path (§2d) until slice 5 automates it.
[tasks."funes:serve"]
description = "funes: boot the sovereign MCP channel (loopback) against the scratch db + an iex to mint tokens"
dir = "modules/funes"
run = "FUNES_DB=.dev/funes.db FUNES_START_MCP=1 iex -S mix"

[tasks."pi:test"]
description = "manos/pi: the brief renderer unit suite (bun test) — the TDD loop"
dir = "modules/manos/pi"
run = "bun test"

[tasks."pi:check"]
description = "manos/pi: the precommit gate — install (frozen), typecheck, tests"
dir = "modules/manos/pi"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

[tasks."aleph:test"]
description = "aleph: run the test suite (the render path, headless)"
dir = "modules/aleph"
run = "mix test"

[tasks."aleph:check"]
description = "aleph: the precommit gate — format + warnings-as-errors + tests"
dir = "modules/aleph"
run = "mix precommit"

[tasks."aleph:setup"]
description = "aleph: fetch deps, create + migrate the shared funes db (via Funes.Repo)"
dir = "modules/aleph"
run = "mix deps.get && FUNES_DB=../funes/.dev/funes.db mix ecto.create -r Funes.Repo --quiet && FUNES_DB=../funes/.dev/funes.db mix ecto.migrate -r Funes.Repo"

[tasks."aleph:seed"]
description = "aleph: seed the shared db with sample threads/agents/sessions for the cockpit"
dir = "modules/aleph"
run = "FUNES_DB=../funes/.dev/funes.db mix aleph.seed"

# The cockpit reads the SAME db funes' own tasks use (../funes/.dev/funes.db), so posting from
# another shell (mise run funes:doctor, an iex) shows up live. Run in ghostty.
[tasks."aleph:run"]
description = "aleph: launch the live cockpit in THIS terminal (run in ghostty)"
dir = "modules/aleph"
run = "FUNES_DB=../funes/.dev/funes.db mix aleph.run"

[tasks.check]
description = "Everything green: the funes + aleph + pi precommit gates (format + warnings + credo + types + tests)"
depends = ["funes:check", "aleph:check", "pi:check"]

[tasks."flake:check"]
description = "machine: nix flake check — the machine-level gate"
run = "nix flake check"

[tasks."home:switch"]
description = "machine: apply the home-manager profile"
run = "nix run github:nix-community/home-manager -- switch --flake .#personalbox"
