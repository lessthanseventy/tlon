# mise.toml — the shared dev-loop API for ficciones.
#
# Everything runs through `mise run <task>` (`mise tasks` lists them) — one vocabulary
# for human and agent, no second source of truth. mise owns the dev runtime; Nix owns
# packaging and the system.

[tools]
# Combined build (precompiled for this OTP) — pairing a bare "1.19" with a separate
# erlang picks an incompatible OTP and fails to boot. OTP 28: aleph needs it
# (ghostty_ex/libghostty-vt) and boots funes, so the whole repo runs on one OTP.
erlang = "28"
elixir = "1.19.5-otp-28"
# manos' pi adapter is TypeScript; bun runs it natively (no build step) and is the test
# runner. mise owns the dev runtime, so the JS toolchain is pinned here too, not assumed.
bun = "1.3.14"

# Secrets from the agenix-decrypted file (flake.nix age.secrets), no runtime unlock needed.
# File-level, not per-task: pi launches many ways and all need the key. Falls back to
# $OLLAMA_API_KEY from the env if the secret file isn't there yet.
[env]
# `$(cat …)` strips a trailing newline that would otherwise break the Authorization header.
# if/else, not `&&…||`: mise runs exec under `sh -o errexit`, so `&&…||` exits non-zero on the
# empty-file case and fails the render.
OLLAMA_API_KEY = "{{ exec(command='p=\"${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/agenix/ollama-api-key\"; v=\"$(cat \"$p\" 2>/dev/null)\" || true; if [ -n \"$v\" ]; then printf %s \"$v\"; else printf %s \"$OLLAMA_API_KEY\"; fi') }}"

[tasks."funes:test"]
description = "funes: run the test suite (the TDD loop)"
dir = "modules/funes"
run = "mix test"

[tasks."funes:check"]
description = "funes: the precommit gate — format + warnings-as-errors + credo + tests"
dir = "modules/funes"
run = "mix precommit"

[tasks."funes:setup"]
description = "funes: fetch deps, create + migrate a repo-local scratch db"
dir = "modules/funes"
run = "mix deps.get && FUNES_DB=.dev/funes.db mix ecto.create --quiet && FUNES_DB=.dev/funes.db mix ecto.migrate"

[tasks."funes:doctor"]
description = "funes: the 2am report against the scratch db"
dir = "modules/funes"
run = "FUNES_DB=.dev/funes.db mix funes.doctor"

# Boot funes with its sovereign channel on, loopback-only, against the scratch db — so
# a hand-spawned pi pane has something to register with. `Funes.MCP.Spawn.env("title",
# "Agent")` in the iex it drops you into prints the export FUNES_* block to paste into the pane.
[tasks."funes:serve"]
description = "funes: boot the sovereign MCP channel (loopback) against the scratch db + an iex to mint tokens"
dir = "modules/funes"
run = "FUNES_DB=.dev/funes.db FUNES_START_MCP=1 iex -S mix"

# `funes:serve` above is the DEV path (hand-run iex on the scratch db); these run the
# same funes as a self-contained release, headless, on the REAL db, kept up by the
# home-manager systemd --user service. A release bundles ERTS, so the unit runs one
# absolute path with nothing on PATH, and `remote`/`rpc` reach the LIVE node.
[tasks."funes:release"]
description = "funes: build the self-contained release the always-up service runs (prod)"
dir = "modules/funes"
run = "MIX_ENV=prod mix release --overwrite"

[tasks."funes:restart"]
description = "funes: rebuild the release + restart the always-up service (redeploy a funes change)"
depends = ["funes:release"]
run = "systemctl --user restart funes && systemctl --user --no-pager status funes | head -12"

[tasks."funes:console"]
description = "funes: remote iex INTO the running service node — inspect/mint against the live channel"
dir = "modules/funes"
run = "_build/prod/rel/funes/bin/funes remote"

[tasks."funes:logs"]
description = "funes: follow the always-up service's logs"
run = "journalctl --user -u funes -n 80 -f"

# Operate/script access to the LIVE channel from the shell — the human+Claude-Code peer
# to the agents' MCP tools. Goes through `bin/funes rpc` INTO the running service node:
# a token minted anywhere else dies with its node, and roster/presence is in-memory
# there. Thin and deliberate — operate access, NOT a second cockpit (aleph is the rich surface).
[tasks."funes:spawn"]
description = "funes: mint a fresh pane's env (open thread + staff agent + token) against the LIVE service — paste the export block into a pi pane"
run = "scripts/funes-cli.sh spawn"

[tasks."funes:roster"]
description = "funes: who's on the clock — every live session, warm/cold (Staff.roster), against the LIVE service"
run = "scripts/funes-cli.sh roster"

[tasks."funes:dossier"]
description = "funes: render a thread's brief from the shell (Board.in_scope → Brief) — parity with the get_dossier MCP tool"
run = "scripts/funes-cli.sh dossier"

[tasks."funes:post"]
description = "funes: post to a thread as the operator from the shell — parity with the agents' post_message"
run = "scripts/funes-cli.sh post"

# Launch Claude Code as a funes citizen. No arg → a fresh thread; a numeric thread-id →
# JOIN it (resume across a /clear). Scopes the funes MCP server (fresh token per
# connect) + the SessionStart brief hook to THIS session via --mcp-config/--settings —
# no ~/.claude mutation, so a plain `claude` stays untouched.
[tasks."funes:claude"]
description = "launch Claude Code as a funes citizen — `funes:claude` (fresh thread) or `funes:claude -- <id>` (join)"
run = "modules/manos/claude-code/launch.sh"

[tasks.cap]
description = "Run a command once, capture ALL output to a log, print exit + failures + tail — then read the log for more, never re-run (see AGENTS.md)"
run = "scripts/cap.sh"

[tasks."cap:clean"]
description = "Sweep all captured run logs (.logs/) — they self-cap at CAP_KEEP (40), this clears them now"
run = "rm -rf .logs && echo 'swept .logs/'"

[tasks."ollama:usage"]
description = "ollama.com: read the plan/rate-limit dashboard (session + weekly caps, per-model request counts) via /api/usage — the insight layer for model choice"
run = "scripts/ollama-usage.sh"

[tasks.watch]
description = "Re-run a command on every file change, printing cap's signal — register in the background, edit, get pass/fail automatically (see AGENTS.md)"
run = "scripts/watch.sh"

# The `[w]atchexec` bracket is the trick: `pkill -f`/`pgrep -f` match a process's ENTIRE
# argv, so a naive `pkill -f watchexec` would match its own argv and signal ITSELF.
# `[w]atchexec` never appears literally in its own command line, so it only matches real
# watchexec processes; `--project-origin $root` scopes it to this repo.
[tasks."watch:stop"]
description = "Stop ficciones file-watchers left running in the background (safe: never signals its own shell)"
run = '''
root="$(git rev-parse --show-toplevel)"
pids="$(pgrep -f "[w]atchexec.*--project-origin $root" || true)"
if [ -n "$pids" ]; then echo "stopping watchexec: $pids"; kill $pids; else echo "no ficciones watchers running"; fi
'''

[tasks."funes:watch"]
description = "funes: re-run the suite on every change under modules/funes (cap signal)"
dir = "modules/funes"
run = "../../scripts/watch.sh mise exec -- mix test"

[tasks."manos:pi:watch"]
description = "manos/pi renderer: re-run the suite on every change (cap signal)"
dir = "modules/manos/pi"
run = "../../scripts/watch.sh bun test"

[tasks."manos:pi:test"]
description = "manos/pi renderer: the brief renderer unit suite (bun test) — the TDD loop"
dir = "modules/manos/pi"
run = "bun test"

[tasks."manos:pi:check"]
description = "manos/pi renderer: the precommit gate — install (frozen), typecheck, tests"
dir = "modules/manos/pi"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

[tasks."manos:consult:watch"]
description = "manos/consult: re-run the suite on every change (cap signal)"
dir = "modules/manos/consult"
run = "../../scripts/watch.sh bun test"

[tasks."manos:consult:test"]
description = "manos/consult: the delegation unit suite (bun test) — the TDD loop"
dir = "modules/manos/consult"
run = "bun test"

[tasks."manos:consult:check"]
description = "manos/consult: the precommit gate — install (frozen), typecheck, tests"
dir = "modules/manos/consult"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

[tasks."manos:fmt:check"]
description = "manos/fmt: the precommit gate — install (frozen), typecheck, tests"
dir = "modules/manos/fmt"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

[tasks."manos:lsp:check"]
description = "manos/lsp: the pi shim's precommit gate — install (frozen), typecheck, tests"
dir = "modules/manos/lsp"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

[tasks."manos:lspd:check"]
description = "manos/lspd: the sidecar daemon's precommit gate — install (frozen), typecheck, tests"
dir = "modules/manos/lspd"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

# Run the LSP sidecar in the foreground (dev). --watch reloads daemon code on edit (restarts the
# daemon, not pi — Expert cold-starts once). Normal use needs no task: the pi shim auto-spawns the
# daemon on first tool call. A systemd --user unit for real supervision is the remaining design step.
[tasks."lspd"]
description = "manos/lspd: run the LSP sidecar daemon in the foreground (bun --watch, dev)"
dir = "modules/manos/lspd"
run = "bun --watch run src/server.ts"

[tasks."manos:reload:check"]
description = "manos/reload: the precommit gate — install (frozen), typecheck, tests"
dir = "modules/manos/reload"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

[tasks."manos:footer:check"]
description = "manos/footer: the statusline's precommit gate — install (frozen), typecheck, tests"
dir = "modules/manos/footer"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

# The safety gate the `reload` tool runs before respawning pi: every manos pi extension must
# typecheck (a syntax error would respawn pi into code it can't load). Fast — tsc only, no tests
# or install; runs from the repo root, one package at a time.
[tasks."manos:typecheck"]
description = "manos: typecheck every pi extension (fast — the `reload` safety gate)"
run = """
set -e
for d in pi consult fmt lsp lspd reload footer; do
  ( cd "modules/manos/$d" && bun run typecheck )
done
"""

[tasks."aleph:test"]
description = "aleph: run the test suite (the render path, headless)"
dir = "modules/aleph"
run = "mix test"

[tasks."aleph:check"]
description = "aleph: the precommit gate — format + warnings-as-errors + tests"
dir = "modules/aleph"
run = "mix precommit"

[tasks."aleph:setup"]
description = "aleph: fetch deps, create + migrate the shared funes db (via Funes.Repo)"
dir = "modules/aleph"
run = "mix deps.get && FUNES_DB=../funes/.dev/funes.db mix ecto.create -r Funes.Repo --quiet && FUNES_DB=../funes/.dev/funes.db mix ecto.migrate -r Funes.Repo"

[tasks."aleph:seed"]
description = "aleph: seed the shared db with sample threads/agents/sessions for the cockpit"
dir = "modules/aleph"
run = "FUNES_DB=../funes/.dev/funes.db mix aleph.seed"

# B1.4's clean-slate step: the old machine threads under the staffing experiment are disposable —
# clear them once, by hand, before ensure_thread_sessions starts spawning per-thread windows.
# Never touches project-scope threads; the always-up service db is untouched (dev db only).
[tasks."aleph:clear-machine-threads"]
description = "aleph: B1.4 clean-slate — delete every MACHINE-scope thread + its messages from the dev db (project threads untouched)"
dir = "modules/aleph"
run = "FUNES_DB=../funes/.dev/funes.db mix aleph.clear_machine_threads"

# The cockpit reads the SAME db funes' own tasks use, so posting from another shell
# shows up live. Run in ghostty.
[tasks."aleph:run"]
description = "aleph: launch the live cockpit in THIS terminal (run in ghostty)"
dir = "modules/aleph"
# Self-heals before launch, fully: Tlön sessions are NOT meant to survive teardown, so kill the
# aleph-tertius tmux server up front. A crashed cockpit leaves that server squatting port 4041 via an
# inherited fd (the reaper leaves tmux alone by design), so killing it is what actually frees the
# port — then aleph-reap.sh clears any beam still holding it. A fresh coworker spawns on entry.
# The coworker lives on its OWN tmux server (-L aleph-tertius, persistence-free config from the
# profile dir) — never the default server, where resurrect/continuum would restore it stale.
run = """
# Kill the coworker's tmux server first (releases the inherited port-4041 fd), then reap.
if tmux -L aleph-tertius kill-server 2>/dev/null; then echo "aleph:run — killed the aleph-tertius tmux server (fresh coworker on entry)"; fi
# Legacy: the coworker socket used to be aleph-tlon (before the tertius rename).
if tmux -L aleph-tlon kill-server 2>/dev/null; then echo "aleph:run — killed a legacy aleph-tlon tmux server"; fi
# Pre-socket-isolation leftover: a zombie `tlon` session on the DEFAULT server.
if tmux kill-session -t tlon 2>/dev/null; then echo "aleph:run — dropped a legacy tlon session from the default tmux server"; fi
../../scripts/aleph-reap.sh || exit $?
# Apply any pending migrations to the dev scratch db BEFORE launch. A fresh funes slice
# (e.g. the consult migration) would otherwise trip the behind-DB guard and refuse to boot,
# forcing a manual `aleph:setup`. Safe to auto-apply here: this is the throwaway dev db and
# migrations are additive — it never touches the always-up service db (that's home:switch's).
# No deps.get, so no network. The Elixir guard stays as a backstop for a bare `mix aleph.run`.
FUNES_DB=../funes/.dev/funes.db mix ecto.migrate -r Funes.Repo || exit $?
FUNES_DB=../funes/.dev/funes.db mix aleph.run
"""

# Fixes "stale code" symptoms — almost always a lingering process/session (BEAM doesn't
# hot-reload; tmux continuum can restore an unwired tlon session), not a real bug.
# Resets the RUNTIME only (cockpit + Tlön panes + compiled artifacts) — it NEVER touches
# the db, so threads/messages/consults survive. To wipe data, use `aleph:reset:db`.
# Follow with `aleph:run` for a fresh cockpit.
[tasks."aleph:reset"]
description = "aleph: reset the Tlön RUNTIME to known-good — reap the stale cockpit + port 4041, kill the aleph-tertius tmux server (+ any legacy default-server tlon session), mix clean (no stale beam/NIF), then report the env. Kills the cockpit + panes; the db (threads/messages) is UNTOUCHED — use aleph:reset:db to wipe data."
dir = "modules/aleph"
run = """
../../scripts/aleph-reap.sh || true
if tmux -L aleph-tertius kill-server 2>/dev/null; then echo "aleph:reset — killed the aleph-tertius tmux server (next entry recreates it fresh)"; else echo "aleph:reset — no aleph-tertius tmux server"; fi
# Legacy: the coworker socket used to be aleph-tlon (before the tertius rename).
if tmux -L aleph-tlon kill-server 2>/dev/null; then echo "aleph:reset — killed a legacy aleph-tlon tmux server"; fi
if tmux kill-session -t tlon 2>/dev/null; then echo "aleph:reset — dropped a LEGACY tlon session from the default tmux server"; fi
mix clean >/dev/null 2>&1 && echo "aleph:reset — mix clean (fresh compile on next aleph:run)"
echo "--- env now ---"
for p in 4040 4041; do if ss -tlnH "sport = :$p" 2>/dev/null | grep -q .; then echo "  port $p: LISTENING"; else echo "  port $p: free"; fi; done
if tmux -L aleph-tertius has-session -t tlon 2>/dev/null; then echo "  tlon session (aleph-tertius server): present"; else echo "  tlon session: gone (clean)"; fi
echo "aleph:reset — done. Run 'mise run aleph:run' for a fresh, wired cockpit."
"""

# The DATA wipe `aleph:reset` deliberately is NOT — separate + explicitly named so a fresh
# db is never a reflex. Drops → recreates → migrates the dev scratch db, destroying every
# dogfood thread/message/consult in it. Only the dev db (../funes/.dev/funes.db); the
# always-up service db is untouched. Use when the schema state is wedged or you want a clean
# slate, not for "stale code" symptoms (that's `aleph:reset`).
[tasks."aleph:reset:db"]
description = "aleph: WIPE the dev scratch db (drop → recreate → migrate) — DESTROYS all dogfood threads/messages/consults. The data reset aleph:reset deliberately does NOT do; only the dev db, never the service db."
dir = "modules/aleph"
run = """
printf 'This WIPES the dev db — every dogfood thread/message/consult is gone.\\nType RESET to confirm: '
read -r confirm
if [ "$confirm" != "RESET" ]; then echo "aleph:reset:db — aborted (nothing wiped)."; exit 1; fi
FUNES_DB=../funes/.dev/funes.db mix ecto.drop -r Funes.Repo || exit $?
FUNES_DB=../funes/.dev/funes.db mix ecto.create -r Funes.Repo --quiet || exit $?
FUNES_DB=../funes/.dev/funes.db mix ecto.migrate -r Funes.Repo || exit $?
echo "aleph:reset:db — dev db wiped, recreated, and migrated (fresh + empty)."
"""

[tasks.check]
description = "Everything green: the funes + aleph + manos (pi + consult + fmt + lsp + reload + footer) precommit gates (format + warnings + credo + types + tests)"
depends = ["funes:check", "aleph:check", "manos:pi:check", "manos:consult:check", "manos:fmt:check", "manos:lsp:check", "manos:lspd:check", "manos:reload:check", "manos:footer:check"]

[tasks."flake:check"]
description = "machine: nix flake check + build the activation script — the machine-level gate"
# `nix flake check` only EVALUATES homeConfigurations; it never builds the activation script, so a
# bash syntax error in a home.activation block sails through it and only explodes at home:switch.
# Building activationPackage runs home-manager's syntax check, which is what actually catches it.
run = [
  "nix flake check",
  "nix build --no-link .#homeConfigurations.personalbox.activationPackage",
]

[tasks."home:switch"]
description = "machine: apply the home-manager profile"
run = "nix run github:nix-community/home-manager -- switch --flake .#personalbox -b backup"

# pi the agent — model launchers, pinned to a model + thinking level. NOT the manos/pi
# renderer (that's manos:pi:test/check/watch above) — distinct namespace. All draw on
# the flat $20 ollama.com plan (kimi-k3 excluded: bills as EXTRA usage on top). Bare
# `pi` already starts on ollama-cloud/glm-5.2; these are one-command alternates —
# in-session Ctrl+P still cycles the same ring. Args pass through:
# `mise run pi:deep -- -p "one-shot prompt"`. Full when-to-reach-for-each: AGENTS.md.

[tasks."pi:balanced"]
description = "pi agent: balanced everyday driver — glm-5.2 (Claude/GPT-alike, 976K ctx)"
run = "modules/manos/pi/launch.sh --provider ollama-cloud --model glm-5.2"

[tasks."pi:deep"]
description = "pi agent: deep reasoning — deepseek-v4-pro, thinking:high (the hard 10%, before you'd reach for Claude)"
run = "modules/manos/pi/launch.sh --provider ollama-cloud --model deepseek-v4-pro --thinking high"

[tasks."pi:code"]
description = "pi agent: coding-heavy — kimi-k2.7-code (code-specialized, ~30% fewer thinking tokens)"
run = "modules/manos/pi/launch.sh --provider ollama-cloud --model kimi-k2.7-code"

[tasks."pi:fast"]
description = "pi agent: quick/cheap throwaway — deepseek-v4-flash, thinking:low (1M ctx, fast tier)"
run = "modules/manos/pi/launch.sh --provider ollama-cloud --model deepseek-v4-flash --thinking low"

[tasks."pi:local"]
description = "pi agent: free/offline grunt — qwen3-coder on the local ollama daemon (no cloud budget)"
run = "modules/manos/pi/launch.sh --provider ollama --model qwen3-coder"

# The flake pins WHICH extensions (manosWiring's `packages` list), but pi owns the mutable npm
# install (~/.pi/agent/npm) and its VERSIONS — that dir is not nix-managed. So `home:switch` never
# bumps an extension; this task is the update path, keeping it in the one control loop instead of an
# ad-hoc `pi update` off the startup nag. Also updates the Tlön coworker profile (its own npm/ under
# ~/.pi/profiles/tlon) when aleph has materialised it. See [[pi-automode-guardrail]].
[tasks."pi:update"]
description = "pi agent: update installed npm extensions to the latest the flake's package list allows (pi owns the mutable npm/ install, not nix — this is the update path, NOT home:switch). Also updates the Tlön coworker profile if present."
run = """
pi update --extensions
if [ -d "$HOME/.pi/profiles/tlon" ]; then
  echo "pi:update — updating the Tlön coworker profile too"
  PI_CODING_AGENT_DIR="$HOME/.pi/profiles/tlon" pi update --extensions
fi
"""
