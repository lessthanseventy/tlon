# tasks/menard.toml — the gate of the ~/projects/menard dev checkout, Menard's Elixir repo tools.
# Included by mise.toml. The CLI is not a task: agents call ~/projects/menard/bin/menard by path (AGENTS.md).

["menard:check"]
description = "menard: its own gate — format + warnings-as-errors + tests"
dir = "{{env.HOME}}/projects/menard"
run = "mix format --check-formatted && mix compile --warnings-as-errors && mix test"
