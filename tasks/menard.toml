# tasks/menard.toml — Menard, the Elixir repo tools: AST-aware edits and
# introspection that run from menard's own project, so they work while the app being edited
# does not compile. Paths are relative to where you stand; `--in DIR` for the run/inspect verbs.
# Included by mise.toml ([task_config] includes). It lives HERE, not beside the tool, because
# menard ships as a standalone repo: WHERE its checkout is, is ficciones' business, not menard's.

["menard"]
description = "menard: any verb (--frozen runs the last build, for editing menard itself) — `mise run menard -- rename OLD NEW [--atoms] [--comments] FILES` · `write FILE CODE` · `clause replace|rewrite|delete|insert-after|insert-before FILE name/arity HEAD [CODE] [--nth N]` · `clause insert-at FILE (Mod|-) [top|bottom] CODE` · `stmt insert-after|insert-before|replace|delete|list FILE name/arity HEAD MATCH [CODE]` · `attr get|set|delete|list FILE NAME [VALUE]` · `block get|replace|add|relabel|list FILE NAME [CODE]` · `directive add|remove|list FILE KIND MOD` · `module add|list FILE [CODE]` · `deps FILE name/arity` · `clause doc|comment FILE name/arity HEAD [TEXT]` · `clause visibility FILE name/arity public|private` · `outline FILE` · `diagnostics [--in DIR]` · `inspect [--in DIR] callers|exports|deps` · `run [--in DIR] check|test|format|compile`"
dir = "modules/menard"
run = "bin/menard"

["menard:check"]
description = "menard: its own gate — format + warnings-as-errors + tests"
dir = "modules/menard"
run = "mix format --check-formatted && mix compile --warnings-as-errors && mix test"
