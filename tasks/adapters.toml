# tasks/adapters.toml — the adapters (the Claude Code mod and its helpers, lsp, lspd). Included by
# mise.toml ([task_config] includes); each top-level table is a task. `mise tasks` lists them all.

["adapters:claude-code:watch"]
description = "adapters/claude-code: re-run the mod's helper suite on every change (cap signal)"
dir = "adapters/claude-code"
run = "../../scripts/watch.sh bun test lib"

["adapters:claude-code:check"]
description = "adapters/claude-code: the helpers' precommit gate — install (frozen), typecheck, tests (CI runs this one)"
dir = "adapters/claude-code"
run = "bun install --frozen-lockfile && bun run typecheck && bun test lib"

["adapters:lsp:check"]
description = "adapters/lsp: the LSP MCP server's precommit gate — install (frozen), typecheck, tests"
dir = "adapters/lsp"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

["adapters:lspd:check"]
description = "adapters/lspd: the sidecar daemon's precommit gate — install (frozen), typecheck, tests"
dir = "adapters/lspd"
run = "bun install --frozen-lockfile && bun run typecheck && bun test"

# Run the LSP sidecar in the foreground (dev). --watch reloads daemon code on edit (restarts the
# daemon — Expert cold-starts once). Normal use needs no task: the lsp MCP server auto-spawns the
# daemon on first tool call. A systemd --user unit for real supervision is the remaining design step.
["lspd"]
description = "adapters/lspd: run the LSP sidecar daemon in the foreground (bun --watch, dev)"
dir = "adapters/lspd"
run = "bun --watch run src/server.ts"

# `claude plugin test` runs every *.test.ts under the plugin root, and the root is adapters/ (a mod
# imports only from inside its own folder, and its helpers live in claude-code/lib), so the bun suites
# would load as mod tests: the mod's tests run on a copy without them. Needs Claude Code itself, so it
# is the machine's gate, not CI's.
["adapters:claude-code:mod"]
description = "adapters/claude-code: the mod's gate — validate it (strict), then its tests in Claude Code's own kit"
dir = "adapters"
run = """
set -e
claude plugin validate --strict .
stage="$(mktemp -d)"
trap 'rm -rf "$stage"' EXIT
git ls-files --cached --others --exclude-standard | grep -v '\\.test\\.tsx\\?$' | cpio -pdm --quiet "$stage"
cp claude-code/*.test.ts "$stage/claude-code/"
claude plugin test "$stage"
"""
