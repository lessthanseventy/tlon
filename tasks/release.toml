["release:cut"]
description = "release: move the release pointer (default origin/main; fast-forward only, merged work only; `-- --rollback` to go back); when server code changed, build it in .release and restart once quiet"
run = "scripts/release.sh cut"

["release:status"]
description = "release: what the service runs against what main has waiting, and whether main is releasable (gate, smoke, quiet)"
run = "scripts/release.sh status"

["release:smoke"]
description = "release: smoke a candidate (default origin/main) — a scratch release on a scratch port and db, /api/office, a thread opened; exit code is the verdict"
run = "scripts/run-from-root.sh release-smoke.sh"

[install]
description = "after a landing: cut the release at origin/main, so what landed is what runs, then build and install Asterion for this machine (house:install; babylon runs this once a change is on main). A failed Asterion build only warns: the cut is done and the landing stands"
run = [
  "scripts/release.sh cut",
  "scripts/house-app.sh install || echo 'install: WARNING: the Asterion build failed; the release is cut, Asterion on this machine is stale' >&2",
]
