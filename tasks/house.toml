# tasks/house.toml — the house: the standalone Godot window over the home. Included by mise.toml
# ([task_config] includes); each top-level table is a task. Godot is the machine's, not mise's.

["house:run"]
description = "house: the window over the live server: the home (what the jots left open, what is coming, the notes) and the office (the crew, what waits on you); `-- --office` starts in the office (TLON_URL; art from TLON_ART_DIR)"
run = "godot --path house"

["house:demo"]
description = "house: the window on made-up things, no server (both rooms; `-- --office` starts in the office)"
run = "godot --path house -- --demo"

["house:widget"]
description = "house: the room alone in a borderless always-on-top window (656x432) over the live server (W toggles it in the full window; drag the room to move it, the spot is remembered)"
run = "godot --path house -- --widget"

["house:soak"]
description = "house: a simulated ten hours of the person and the pets on the grid, decorating (placement rules, reachability, saving, the pointer work), the closet's composition over every ready-made, the jar, knock rules, rhythm, door and TV hacks, and the POST and GET routes against a local stub (needs Godot)"
run = "godot --headless --path house --script res://soak.gd 2>&1 | { tee /dev/stderr | grep -q '^SOAK OK'; }"

["house:check"]
description = "house: every script loads clean in headless Godot (not in `check`: Godot is not a mise tool)"
run = "godot --headless --path house --quit 2>&1 | { ! grep -E 'ERROR|SCRIPT ERROR|Parse Error'; }"

["house:art-pack"]
description = "house: pack the art the house can open (derived from its loaders, with each pack's LICENSE.txt) into ~/.cache/tlon/house-dist/house-art.zip, outside the repo, and print files and size per pack; `-- --list` prints the files and builds nothing (art from TLON_ART_DIR)"
run = "scripts/house-art-pack.sh \"$@\""

["house:build"]
description = "house: `-- windows|mac|linux|all` — export the house with the art inside it (Windows and Linux: one file; the Mac app carries the pack in Resources) into ~/.cache/tlon/house-dist/<platform>/ and the-house-<platform>.zip (never inside a repo: the art's licence forbids redistributing it; hand the zips over privately; needs Godot's 4.7.2 export templates; the Mac build is unsigned, see house/SHIPPING.md)"
run = "scripts/house-build.sh \"$@\""
