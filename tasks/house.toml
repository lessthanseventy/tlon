# tasks/house.toml — the house: the standalone Godot window over the home. Included by mise.toml
# ([task_config] includes); each top-level table is a task. Godot is the machine's, not mise's.

["house:run"]
description = "house: the window over the live server: the home (what the jots left open, what is coming, the notes) and the office (the crew, what waits on you); `-- --office` starts in the office (TLON_URL; art from TLON_ART_DIR)"
run = "godot --path house"

["house:demo"]
description = "house: the window on made-up things, no server (both rooms; `-- --office` starts in the office)"
run = "godot --path house -- --demo"

["house:check"]
description = "house: every script loads clean in headless Godot (not in `check`: Godot is not a mise tool)"
run = "godot --headless --path house --quit 2>&1 | { ! grep -E 'ERROR|SCRIPT ERROR|Parse Error'; }"
