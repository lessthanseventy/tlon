# tasks/house.toml — the house: the standalone Godot window over the home. Included by mise.toml
# ([task_config] includes); each top-level table is a task. Godot is the machine's, not mise's.

["house:run"]
description = "house: the window over the live server: the home (what the jots left open, what is coming, the notes) (TLON_URL; art from TLON_ART_DIR)"
run = "godot --path house"

["house:install"]
description = "house: build Asterion for this machine (Linux, art inside, as house:build) and install it at ~/.local/share/asterion/asterion (TLON_ASTERION_BIN), replaced atomically; no godot is a named skip (what `install` runs after a landing)"
run = "scripts/house-app.sh install"

["house:app"]
description = "house: run the installed Asterion, the built app (title \"Asterion\", no DEBUG); none installed says to run house:install; `house:run` is the from-source run for development"
run = "scripts/house-app.sh run \"$@\""

["house:demo"]
description = "house: the window on made-up things, no server"
run = "godot --path house -- --demo"

["house:widget"]
description = "house: the room alone in a borderless always-on-top window (720x464) over the live server (W toggles it in the full window; drag the room to move it, the spot is remembered)"
run = "godot --path house -- --widget"

["house:soak"]
description = "house: the scripted room: a simulated ten hours of the person and the pets on the grid, decorating, the closet, the cards, the routes against a local stub, the forms, settings, chat and helpers (needs Godot). `-- chat sidebar` runs only those sections, in the suite's order; `-- --list` prints their names"
run = "d=$(mktemp -d); trap 'rm -rf \"$d\"' EXIT; s() { XDG_DATA_HOME=\"$d\" timeout 1000 godot --headless --path house --script res://soak.gd -- \"$@\" 2>&1 | { tee /dev/stderr | awk '/^SOAK (OK|LIST)/{ok=1} /^(SCRIPT )?ERROR/ && !ok{bad=1} END{exit !(ok && !bad)}'; }; }; s"

["house:check"]
description = "house: every script, the soak's too, loads clean in headless Godot, then the logic checks (house/logic.gd, seconds) pass (not in `check`: Godot is not a mise tool)"
run = "scripts/house-check.sh"

["house:art-pack"]
description = "house: pack the art the house can open (derived from its loaders, with each pack's LICENSE.txt) into ~/.cache/tlon/house-dist/house-art.zip, outside the repo, and print files and size per pack; `-- --list` prints the files and builds nothing (art from TLON_ART_DIR)"
run = "scripts/house-art-pack.sh \"$@\""

["house:build"]
description = "house: `-- windows|mac|linux|all` — export the house with the art inside it (Windows and Linux: one file; the Mac app too, ad-hoc signed) into ~/.cache/tlon/house-dist/<platform>/ and asterion-<platform>.zip (never inside a repo: the art's licence forbids redistributing it; hand the zips over privately; needs Godot's 4.7.2 export templates; the Mac build is ad-hoc signed, not notarized: see house/SHIPPING.md)"
run = "scripts/house-build.sh \"$@\""

["house:drive:start"]
description = "house: start the real house LIVE under headless gamescope on a throwaway data folder (starter list, no server, no network) with a drive port, in the background, and print the port; `-- --demo` for the demo list; `-- --server` reads the tlon server at TLON_URL (else the settings default) instead, and a click then acts on the real list; refuses a second one (scripts/house-drive.sh; house/AGENTS.md `Driving it`)"
run = "scripts/house-drive.sh start \"$@\""

["house:drive"]
description = "house: send each JSON argument to the running drive house and print one reply line each (`-- '{\"do\":\"things\"}' '{\"do\":\"click\",\"x\":900,\"y\":60}'`; commands in house/AGENTS.md `Driving it`; a relative shot path saves under the run's folder)"
run = "scripts/house-drive.sh send \"$@\""

["house:drive:errors"]
description = "house: the Godot ERROR / SCRIPT ERROR lines the drive house has logged since the last call"
run = "scripts/house-drive.sh errors"

["house:drive:stop"]
description = "house: quit the drive house, remove its throwaway data folder and pid file (also when it is already dead)"
run = "scripts/house-drive.sh stop"

["house:gate"]
description = "house: the whole verification, fast: house:check, then every soak section as its own headless Godot in parallel (TLON_HOUSE_JOBS at once, default half the cores), a table of times, every FAIL named by its section; `-- --if-changed` runs only when house/ changed in the commits being gated (what `check` does); no godot is a named skip, red with TLON_HOUSE_GATE=required (needs Godot)"
run = "scripts/house-gate.sh \"$@\""

["check:house"]
description = "the house's gate when house/ changed in the commits being gated (scripts/house-gate.sh --if-changed): unchanged is said and passes, no godot is a named skip, red with TLON_HOUSE_GATE=required"
wait_for = ["server:check", "server:eval-det", "adapters:claude-code:check", "adapters:claude-code:mod", "adapters:lsp:check", "adapters:lspd:check"]
run = "scripts/house-gate.sh --if-changed"

["house:import"]
description = "house: read the server's home (GET /api/home/export, nothing there is changed) and print what it would add to the house's own list, row counts per kind beside the server's; `-- --write` imports it (idempotent, the house closed), `-- URL` names another server (needs Godot)"
run = "godot --headless --path house --script res://import_server.gd -- \"$@\""
