# tasks/pi.toml — pi: profiles and helpers. Included by mise.toml ([task_config] includes);
# each top-level table is a task. `mise tasks` lists them all.

["pi:balanced"]
description = "pi agent: balanced everyday driver — glm-5.2 (Claude/GPT-alike, 976K ctx)"
run = "adapters/pi/launch.sh --provider ollama-cloud --model glm-5.2"

["pi:deep"]
description = "pi agent: deep reasoning — deepseek-v4-pro, thinking:high (the hard 10%, before you'd reach for Claude)"
run = "adapters/pi/launch.sh --provider ollama-cloud --model deepseek-v4-pro --thinking high"

["pi:code"]
description = "pi agent: coding-heavy — kimi-k2.7-code (code-specialized, ~30% fewer thinking tokens)"
run = "adapters/pi/launch.sh --provider ollama-cloud --model kimi-k2.7-code"

["pi:fast"]
description = "pi agent: quick/cheap throwaway — deepseek-v4-flash, thinking:low (1M ctx, fast tier)"
run = "adapters/pi/launch.sh --provider ollama-cloud --model deepseek-v4-flash --thinking low"

["pi:local"]
description = "pi agent: free/offline grunt — qwen3-coder on the local ollama daemon (no cloud budget)"
run = "adapters/pi/launch.sh --provider ollama --model qwen3-coder"

# The flake pins WHICH extensions (manosWiring's `packages` list), but pi owns the mutable npm
# install (~/.pi/agent/npm) and its VERSIONS — that dir is not nix-managed. So `home:switch` never
# bumps an extension; this task is the update path, keeping it in the one control loop instead of an
# ad-hoc `pi update` off the startup nag. Also updates the Tlön coworker profile (its own npm/ under
# ~/.pi/profiles/tlon) when the console has materialised it.
["pi:update"]
description = "pi agent: update installed npm EXTENSIONS to the latest the flake's package list allows (pi owns the mutable npm/ install, not nix). Does NOT move pi itself — that is pi:upgrade."
run = """
pi update --extensions
if [ -d "$HOME/.pi/profiles/tlon" ]; then
  echo "pi:update — updating the Tlön coworker profile too"
  PI_CODING_AGENT_DIR="$HOME/.pi/profiles/tlon" pi update --extensions
fi
"""

# pi PROPER is nix's: a release tarball pinned (version + hash) in flake.nix. This task moves that
# pin to the latest GitHub release (or `-- 0.85.1`), keeps adapters/pi's pi-* dep ranges in step,
# home:switches, then runs pi:update so the extensions follow. PI_UPGRADE_NO_SWITCH=1 edits only.
["pi:upgrade"]
description = "pi agent: upgrade pi ITSELF — bump the flake's release pin + hash (latest, or `-- <version>`), sync adapters/pi deps, home:switch, then pi:update for the extensions"
run = "adapters/pi/upgrade.sh"
