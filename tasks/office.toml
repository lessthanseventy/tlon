# tasks/office.toml — the office: its shared kit, its rooms, and the standalone TUI. Included by
# mise.toml ([task_config] includes); each top-level table is a task.

["office:run"]
description = "office: the TUI — the room in a terminal over the live server (kitty graphics in ghostty/kitty/WezTerm, half blocks elsewhere; OFFICE_GRAPHICS=blocks|kitty to force)"
dir = "office"
run = "bun tui/main.ts"

["office:watch"]
description = "office: re-run the suite on every change (cap signal)"
dir = "office"
run = "../scripts/watch.sh bun test"

["office:test"]
description = "office: the kit, room and TUI unit suite (bun test)"
dir = "office"
run = "bun test"

["office:check"]
description = "office: the precommit gate — install (frozen), typecheck, tests at 03:00 and at 15:00 (a frozen clock: test/clock.ts)"
dir = "office"
run = "bun install --frozen-lockfile && bun run typecheck && OFFICE_TEST_HOUR=3 bun test && OFFICE_TEST_HOUR=15 bun test"

["office:build"]
description = "office: the TUI as standalone executables, one per platform (macOS + Linux, arm64 + x64), in office/dist — no bun or checkout needed to run one"
dir = "office"
run = "for t in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do bun build --compile --minify --target=bun-$t tui/main.ts --outfile dist/tlon-office-$t || exit 1; done"

["office:drive"]
description = "office: drive the TUI headlessly in a private tmux — each arg a send-keys step, the screen printed after each (TLON_URL=http://127.0.0.1:4041 for server:dev); the drive-office skill"
run = "scripts/office-drive.sh"

["office:golden"]
description = "office: re-hash the wide room's golden frames into office/test/golden.json (after a change meant to move its pixels)"
dir = "office"
run = "bun test/golden.ts"
