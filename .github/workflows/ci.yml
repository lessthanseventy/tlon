# CI runs the same mise tasks as the dev loop (`mise run check` is these four jobs) — one control
# loop, never a second way to run anything. The job names are the required status checks on main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the checkout's mise.toml is ours: trust it without a prompt
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_YES: "1"

jobs:
  server:
    runs-on: ubuntu-24.04
    # a zone with DST, so the schedules' clock-change test runs here rather than skips
    env:
      TZ: America/Denver
    steps:
      - uses: actions/checkout@v4
      # The runner's own Postgres, over the socket at /run/postgresql with peer auth — the setup
      # config.exs assumes — and tmux, which the office read model asks what windows exist.
      - name: postgres and tmux
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
          sudo apt-get install -y --no-install-recommends tmux
      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: erlang elixir
      # a fresh runner has no hex or rebar, and mix won't fetch a dep without them
      - run: mix local.hex --force && mix local.rebar --force
      - uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build
          key: server-${{ runner.os }}-${{ hashFiles('mise.toml', 'server/mix.lock') }}
      - run: mix deps.get
        working-directory: server
      # the source tools run `mix format` in a scratch repo outside this checkout: the runner's
      # global mise needs the same toolchain, or the shim there knows no elixir
      - run: mise use -g "erlang@$(mise current erlang)" "elixir@$(mise current elixir)"
      - run: mise run server:check

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # tmux: the office's terminal test drives a private tmux server
      - run: sudo apt-get install -y --no-install-recommends tmux
      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: bun
      - run: mise run office:check
      - run: mise run adapters:claude-code:check
      - run: mise run adapters:lsp:check
      - run: mise run adapters:lspd:check

  names:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run check:names
      - run: mise run manual:check
